x:
  mode: stream                    # "stream" = real-time | "poll" = recent-search fallback
  keywords:
  poll_interval_seconds: 60
  metrics_refresh:
    enabled: true
    interval_seconds: 900

telegram:
  session_name: collector         # re-created by `python main.py --login` (chunk 3)
  catch_up: true
  backfill:
    enabled: true
    limit: 300          # messages per chat pulled on first run (newest first)
    batch_sleep: 1.0    # pause every 100 msgs (flood politeness)
  targets: 
      - "random_chats_english"    
      - "this_is_redbull_test_channel"                 # PUBLIC channels / open groups only
      - "telegram"
      - "durov"


storage:
  db_path: data/vault.db
  conveyor:
    capacity: 100000
    max_batch: 2000
    max_wait_ms: 200
    overflow_path: data/overflow.jsonl
  ledger:
    anchor_path: data/ledger.anchor
    max_block_size: 4096
  security:
    enforce_immutable_messages: true
  rejected_retention: 10000

analytics:
  db_path: data/vault.db
  pipeline: five_step           # five_step (the 5-step plan) | hybrid | adaptive | llm | legacy
  keep_legacy_analytics: true   # old dashboard panels keep working

  cache:                        # ← NEW: Step 2 — semantic cache settings
    threshold: 0.95             # cosine ≥ this → inherit labels, GPU bypassed
    store_path: data/vector_store
    collection: spectrum_vectors
    min_hits: 500               # cache below this → GPU everything (index warm-up)
    pull_chunk: 250             # messages examined per cycle

  hybrid:                       # kept: Step 3/4 read these (ensemble + fallback gate)
    processed_db: data/processed.db
    pull_chunk: 400
    batch: 16                   # GPU micro-batch
    queue_cap: 100              # backlog > this → Layer 2 (your Step 4)
    batch_timeout_ms: 2000      # observed batch latency > this → Layer 2
    oom_cooldown_s: 300
    force_layer2: false
    irony_threshold: 0.80
    models:
      lid: "l3cube-pune/hing-bert-lid"
      sarcasm: "helinivan/english-sarcasm-detector"
      sentiment: "cardiffnlp/twitter-roberta-base-sentiment-latest"
      emotion: "SamLowe/roberta-base-go_emotions"

  clustering:                   # kept: Step 5 discovery settings
    enabled: true
    scan_minutes: 12            # your "every 12 minutes"
    window_hours: 48
    min_cluster_size: 15
    min_samples: 5
    umap_neighbors: 15
    velocity_recent_h: 6

  llm:                          # kept: Step 5 only — titling + briefing (NOT classification)
    enabled: true
    base_url: "http://127.0.0.1:11434"
    model: "qwen2.5:3b-instruct"
    timeout_s: 90
    keep_alive: 0

  summary:                      # ← NEW: the 100-200 word briefing settings
    window_hours: 24
    max_posts: 60

  embeddings:                   # kept but dormant under five_step (the pipeline embeds
    enabled: true               # internally via the cache; this loop is not started)
    model: "sentence-transformers/all-MiniLM-L6-v2"
    store_path: data/vector_store
    collection: spectrum_vectors
    batch: 64

  nlp:                          # kept: legacy worker (dashboard compatibility)
    enabled: true
    engine: lexicon
    batch: 500
    poll_seconds: 2
  topics:
    enabled: true
    scan_seconds: 60
    window_hours: 72
    recent_hours: 1
    baseline_hours: 24
    min_volume: 5
    viral_multiplier: 10
    viral_min_posts: 100
  graph:
    enabled: true
    build_seconds: 30
    recompute_minutes: 5
    window_hours: 168
    betweenness_max_nodes: 20000
    botnet:
      min_size: 5
      internal_ratio: 0.90
      density: 0.60
  profiles:
    enabled: true
    refresh_hours: 12
    max_per_cycle: 1000
x:
  mode: stream                    # "stream" = real-time | "poll" = recent-search fallback
  keywords:
  poll_interval_seconds: 60
  metrics_refresh:
    enabled: true
    interval_seconds: 900

telegram:
  session_name: collector         # re-created by `python main.py --login` (chunk 3)
  catch_up: true
  backfill:
    enabled: true
    limit: 300          # messages per chat pulled on first run (newest first)
    batch_sleep: 1.0    # pause every 100 msgs (flood politeness)
  targets: 
    - "random_chats_english"    
    - "this_is_redbull_test_channel"                 # PUBLIC channels / open groups only
    - "telegram"
    - "durov"

storage:
  db_path: data/vault.db
  conveyor:
    capacity: 100000
    max_batch: 2000
    max_wait_ms: 200
    overflow_path: data/overflow.jsonl
  ledger:
    anchor_path: data/ledger.anchor
    max_block_size: 4096
  security:
    enforce_immutable_messages: true
  rejected_retention: 10000

analytics:
  db_path: data/vault.db
  nlp:
    enabled: true
    engine: lexicon          # lexicon (fast, offline) | ml (zero-shot transformer)
    batch: 500
    poll_seconds: 2
  topics:
    enabled: true
    scan_seconds: 60
    window_hours: 72
    recent_hours: 1
    baseline_hours: 24
    min_volume: 5
    viral_multiplier: 10
    viral_min_posts: 100
  graph:
    enabled: true
    build_seconds: 30
    recompute_minutes: 5
    window_hours: 168
    betweenness_max_nodes: 20000
    botnet:
      min_size: 5
      internal_ratio: 0.90
      density: 0.60
  profiles:
    enabled: true
    refresh_hours: 12
    max_per_cycle: 1000

dashboard:
  host: 127.0.0.1
  port: 8080

logging:
  level: INFO
  file: logs/collector.log